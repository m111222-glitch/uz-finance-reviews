# Fly.io permanent host for UZ Finance Reviews
# One-time deploy from Terminal:  ./scripts/deploy-fly.sh
# Docs: https://fly.io/docs/

app = 'uz-fin-reviews-mirobi'
primary_region = 'ams'

[build]

[env]
  DASHBOARD_PASSWORD = ''
  DASHBOARD_READONLY = '1'

[http_service]
  internal_port = 8000
  force_https = true
  # Free-tier friendly: sleep when idle, wake on request
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

