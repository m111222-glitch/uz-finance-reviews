# Fly.io permanent host for UZ Finance Reviews
# Deploy: flyctl deploy --remote-only
# Docs: https://fly.io/docs/

app = 'uz-finance-reviews'
primary_region = 'ams'

[build]

[env]
  DASHBOARD_PASSWORD = ''
  DASHBOARD_READONLY = '0'
  AUTO_SYNC_HOURS = '3'
  DATA_DIR = '/data'
  TELEGRAM_LOOKBACK_HOURS = '48'

[mounts]
  source = 'reviews_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  # Stay up so the 3h auto-sync loop actually runs
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
